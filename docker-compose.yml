services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tarozi
      POSTGRES_PASSWORD: tarozi
      POSTGRES_DB: tarozi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarozi"]
      interval: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tarozi:tarozi@db:5432/tarozi
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-in-production-0000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
